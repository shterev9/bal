<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Покана от Тодор Щерев</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --deep-red: #8b0000;
            --black: #1a1a1a;
            --text-light: #f4f4f4;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0c0c0c;
            font-family: 'Montserrat', sans-serif;
        }

        .card-container {
            perspective: 1500px;
        }

        .card {
            width: 380px;
            min-height: 540px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.open {
            transform: rotateY(-180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* ЛИЦЕ */
        .card-front {
            background: linear-gradient(135deg, #2c2c2c 0%, #000000 100%);
            border: 2px solid var(--gold);
            color: var(--gold);
        }

        .card-front h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 50px;
            margin: 10px 0;
        }

        /* ВЪТРЕШНА ЧАСТ */
        .card-back {
            background: radial-gradient(circle, #a30000 0%, #6b0000 100%);
            color: var(--text-light);
            transform: rotateY(180deg);
            border: 2px solid var(--gold);
            justify-content: space-between;
        }

        .guest-name {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-light);
            margin-top: 10px;
        }

        .guest-highlight {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            margin: 5px 0 15px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            padding-bottom: 5px;
        }

        .card-back h1 {
            font-family: 'Great Vibes', cursive;
            color: var(--gold);
            font-size: 34px;
            margin: 5px 0;
        }

        .main-text {
            font-size: 15px;
            line-height: 1.5;
            font-weight: 300;
        }

        .restaurant-box {
            border: 1px solid var(--gold);
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.2);
            margin: 15px 0;
        }

        .restaurant-name {
            font-weight: 600;
            font-size: 18px;
            color: var(--gold);
        }

        .footer-note {
            font-size: 12px;
            font-style: italic;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .click-hint {
            position: absolute;
            bottom: 20px;
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.6;
            color: var(--gold);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="card" onclick="this.classList.toggle('open')">
            
            <div class="card-face card-front">
                <div style="font-size: 30px; margin-bottom: 10px;">⚜️</div>
                <p style="letter-spacing: 5px; text-transform: uppercase; font-size: 12px;">Покана за</p>
                <h2>Бал</h2>
                <div style="width: 60px; height: 1px; background: var(--gold); margin: 20px 0;"></div>
                <p class="click-hint">КЛИКНИ ЗА ОТВАРЯНЕ</p>
            </div>

            <div class="card-face card-back">
                <div>
                    <p class="guest-name">Скъпи,</p>
                    <p class="guest-highlight">Димитър Тошев</p>
                </div>
                
                <div style="margin: 10px 0;">
                    <p style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--gold);">Аз,</p>
                    <h1>Тодор Щерев</h1>
                </div>
                
                <div class="main-text">
                    <p>имам огромното удоволствие да те поканя на моя</p>
                    <p><strong style="color: var(--gold);">Абитуриентски бал!</strong></p>
                    <p>Нека заедно превърнем тази вечер в незабравим спомен.</p>
                </div>

                <div class="restaurant-box">
                    <div class="restaurant-name">Ресторант "ЧифликЪ"</div>
                </div>

                <p class="footer-note">Очаквам те с нетърпение!</p>
            </div>

        </div>
    </div>

</body>
</html>
